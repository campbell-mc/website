name: Deploy CHRIS-OS

on:
  push:
    branches: [main]

env:
  PROJECT_ID: chris-os
  PROJECT_NUMBER: '525081312967'
  REGION: australia-southeast1
  REGISTRY: australia-southeast1-docker.pkg.dev/chris-os/chris-os
  WEB_SERVICE: chris-web
  SA_EMAIL: github-deploy@chris-os.iam.gserviceaccount.com

jobs:
  deploy-web:
    name: Deploy Web App to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ env.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ env.SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t ${{ env.REGISTRY }}/chris-web:${{ github.sha }} -f apps/web/Dockerfile .
          docker push ${{ env.REGISTRY }}/chris-web:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.WEB_SERVICE }} \
            --image ${{ env.REGISTRY }}/chris-web:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 3 \
            --set-env-vars "NODE_ENV=production" \
            --project ${{ env.PROJECT_ID }}
